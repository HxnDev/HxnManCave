name: Mobile OTA update (EAS Update)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/eas-update.yml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/mobile
        # Same publishable values already committed in eas.json — they are
        # baked into the JS bundle at publish time.
        env:
          CI: "1"
          EXPO_PUBLIC_SUPABASE_URL: https://tsbouqdhocewfdhacdna.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_t7sE_UJmnY8-jVEkdXCeXg_UYdMx0TZ
        # Android only: exporting for web statically renders the app in Node,
        # where the Supabase client crashes on the missing `window` global.
        run: eas update --channel preview --platform android --auto --non-interactive
